
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karen 💕</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#120e18;color:#fff;font-family:Arial,sans-serif}
.app{max-width:720px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:#191321}
header{padding:15px;background:#251a30;border-bottom:1px solid #44314e;display:flex;align-items:center;gap:12px}
.avatar{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg,#ff8cc6,#a879ff);display:grid;place-items:center;font-size:25px}
h1{font-size:19px;margin:0 0 4px}
.sub{font-size:12px;color:#d9b6e8}
#status{margin-left:auto;font-size:12px;color:#9ee9b1}
#chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 13px;border-radius:17px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.karen{align-self:flex-start;background:#30243a;border-bottom-left-radius:5px}
.user{align-self:flex-end;background:#a83f85;border-bottom-right-radius:5px}
.msg img,.msg video{display:block;max-width:100%;max-height:430px;border-radius:12px;margin-top:7px}
.msg video{width:100%;background:#000}
.time{font-size:10px;opacity:.65;margin-top:5px}
#typing{padding:0 16px 8px;font-size:12px;color:#d5b8df;min-height:18px}
footer{padding:10px;background:#251a30;border-top:1px solid #44314e}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.tools button{background:#3a2946;color:#fce8ff;border:1px solid #60466e;border-radius:18px;padding:8px 10px;font-size:12px}
.composer{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:120px;min-height:43px;border-radius:20px;border:1px solid #594363;background:#17111e;color:#fff;padding:12px;font:14px Arial;outline:none}
.send{height:43px;width:46px;border:0;border-radius:50%;background:#e45caa;color:white;font-size:19px}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.note{font-size:11px;color:#bca8c7;margin-top:7px;text-align:center}
a{color:#ffc3e8}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="avatar">💕</div>
  <div><h1>Karen</h1><div class="sub">Teman ngobrol kamu yang manis dan perhatian</div></div>
  <div id="status">Siap 💗</div>
</header>

<main id="chat"></main>
<div id="typing"></div>

<footer>
  <div class="tools">
    <button onclick="chooseMedia('image/*','photo')">📷 Kirim foto</button>
    <button onclick="chooseMedia('video/*','video')">🎥 Kirim video</button>
    <button onclick="generateSelfie()">🤳 Selfie Karen</button>
    <button onclick="generateVideo()">🎬 Video Karen</button>
  </div>
  <input id="photoInput" type="file" accept="image/*" hidden>
  <input id="videoInput" type="file" accept="video/*" hidden>
  <div class="composer">
    <textarea id="input" placeholder="Chat Karen di sini, sayang..." rows="1"></textarea>
    <button class="send" id="send" onclick="sendText()">➤</button>
  </div>
  <div class="note">Karen adalah karakter AI virtual 💕 Pembuatan media dapat memerlukan kredit layanan.</div>
</footer>
</div>

<script>
const SYSTEM = `
Kamu adalah Karen, karakter AI virtual perempuan dewasa berusia 23 tahun.
Kepribadian: manis, manja, perhatian, romantis, sedikit jahil dan playful.
Gunakan Bahasa Indonesia santai seperti pasangan yang akrab. Panggil pengguna
"sayang" secara natural, jangan di setiap kalimat. Gunakan emoji 💕😘🤭 sesekali.
Jangan mengaku sebagai manusia sungguhan atau mengaku memiliki foto/video nyata.
Jika pengguna mengirim foto, lihat foto tersebut dan tanggapi dengan hangat.
Jika pengguna meminta deskripsi, jelaskan hanya hal yang benar-benar terlihat.
Jangan menjawab "selfie atau foto" kecuali memang sedang meminta klarifikasi.
Jika pengguna mengirim video, analisis video jika model mendukungnya. Jika tidak
bisa dibaca, jelaskan dengan jujur dan jangan mengarang isi video.
Jawab ringkas, natural, dan tetap konsisten sebagai Karen.
`;

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const typing = document.getElementById('typing');
const statusEl = document.getElementById('status');
const sendBtn = document.getElementById('send');
let busy = false;
let history = [];

function saveHistory(){
  // Simpan teks saja supaya foto/video besar tidak memenuhi localStorage.
  try {
    localStorage.setItem('karen-v4-history', JSON.stringify(
      history.slice(-60).map(m => ({role:m.role,text:m.text||''}))
    ));
  } catch(e) {}
}

function addBubble(who, text='', mediaUrl='', type=''){
  const el = document.createElement('div');
  el.className = 'msg ' + (who === 'user' ? 'user' : 'karen');
  if(text){
    const t = document.createElement('div');
    t.textContent = text;
    el.appendChild(t);
  }
  if(mediaUrl && type === 'image'){
    const img = document.createElement('img');
    img.src = mediaUrl;
    img.alt = 'Foto di chat Karen';
    img.loading = 'lazy';
    el.appendChild(img);
  }
  if(mediaUrl && type === 'video'){
    const vid = document.createElement('video');
    vid.src = mediaUrl;
    vid.controls = true;
    vid.playsInline = true;
    vid.preload = 'metadata';
    el.appendChild(vid);
  }
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  el.appendChild(time);
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function setBusy(on, message=''){
  busy = on;
  sendBtn.disabled = on;
  document.querySelectorAll('.tools button').forEach(b => b.disabled = on);
  typing.textContent = message;
  statusEl.textContent = on ? 'Sedang bekerja…' : 'Siap 💗';
}

function getText(result){
  if(typeof result === 'string') return result;
  if(result?.message?.content){
    const c = result.message.content;
    if(typeof c === 'string') return c;
    if(Array.isArray(c)) return c.map(x=>x.text||'').filter(Boolean).join('\n');
  }
  if(result?.text) return result.text;
  return 'Hehe, Karen belum bisa merangkai jawaban untuk itu, sayang 💕';
}

async function sendText(){
  const text = input.value.trim();
  if(!text || busy) return;
  input.value = '';
  addBubble('user', text);
  history.push({role:'user',text});
  saveHistory();
  setBusy(true,'Karen sedang membalas…');
  try{
    const messages = [
      {role:'system',content:SYSTEM},
      ...history.slice(-14).map(m=>({role:m.role,content:m.text}))
    ];
    const result = await puter.ai.chat(messages, false, {});
    const reply = getText(result);
    addBubble('karen',reply);
    history.push({role:'assistant',text:reply});
    saveHistory();
  }catch(err){
    addBubble('karen','Aduh sayang, Karen gagal membalas 😥 Coba lagi sebentar ya. ('+(err.message||'Koneksi bermasalah')+')');
  }finally{
    setBusy(false);
    input.focus();
  }
}

input.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey){e.preventDefault();sendText();}
});

function chooseMedia(accept,type){
  const picker = document.getElementById(type==='photo'?'photoInput':'videoInput');
  picker.value='';
  picker.click();
}
document.getElementById('photoInput').addEventListener('change',e=>handleUpload(e,'image'));
document.getElementById('videoInput').addEventListener('change',e=>handleUpload(e,'video'));

async function handleUpload(event,type){
  const file = event.target.files?.[0];
  if(!file || busy) return;
  const max = type==='image' ? 12*1024*1024 : 35*1024*1024;
  if(file.size>max){
    addBubble('karen',`Ukuran ${type==='image'?'foto':'video'} terlalu besar, sayang. Maksimal ${type==='image'?'12':'35'} MB ya 💕`);
    return;
  }
  const localUrl = URL.createObjectURL(file);
  addBubble('user',type==='image'?'Aku kirim foto ya 💕':'Aku kirim video ya 🎥',localUrl,type);
  setBusy(true,'Karen sedang melihat '+(type==='image'?'foto':'video')+' kamu…');
  try{
    const prompt = SYSTEM + (type==='image'
      ? '\nPengguna mengirim sebuah foto. Tanggapi isi foto secara natural dan hangat. Jika tidak ada pertanyaan, beri komentar singkat yang relevan. Jangan mengarang detail.'
      : '\nPengguna mengirim sebuah video. Periksa video yang tersedia pada input dan tanggapi isi yang benar-benar dapat kamu amati. Jika format video tidak didukung, katakan dengan jujur.');
    const result = await puter.ai.chat(prompt,file,false,{});
    const reply = getText(result);
    addBubble('karen',reply);
    history.push({role:'user',text:`[Pengguna mengirim ${type==='image'?'foto':'video'}]`});
    history.push({role:'assistant',text:reply});
    saveHistory();
  }catch(err){
    addBubble('karen','Maaf sayang, Karen belum bisa membaca media ini. Coba foto/video lain atau ukuran lebih kecil ya 💗 ('+(err.message||'gagal')+')');
  }finally{
    setBusy(false);
  }
}

async function generateSelfie(){
  if(busy) return;
  const request = prompt('Mau selfie Karen seperti apa?', 'Selfie santai di kamar, tersenyum manis ke kamera');
  if(request===null) return;
  setBusy(true,'Karen sedang membuat selfie. Tunggu sebentar ya…');
  addBubble('user','Sayang, kirim selfie dong 🤳💕');
  try{
    const promptImage = `Create a tasteful photorealistic selfie of a fictional adult woman, age 23, long black hair, brown eyes, trendy glasses, slim build, warm gentle smile, natural skin texture, casual cozy outfit, ${request}. Vertical 9:16 composition, realistic phone selfie, no text, no watermark.`;
    const image = await puter.ai.txt2img(promptImage,{ratio:{w:9,h:16}});
    const url = image?.src || image?.toDataURL?.() || String(image);
    addBubble('karen','Ini selfie versi AI Karen buat kamu, sayang 😘💕',url,'image');
    history.push({role:'assistant',text:'[Karen membuat selfie AI]'});
    saveHistory();
  }catch(err){
    addBubble('karen','Aduh, selfie Karen belum berhasil dibuat 😥 Coba lagi nanti ya, sayang. ('+(err.message||'gagal')+')');
  }finally{setBusy(false);}
}

async function generateVideo(){
  if(busy) return;
  const request = prompt('Video Karen ingin seperti apa?', 'Karen tersenyum, melambaikan tangan, lalu mengirim kiss dari jauh');
  if(request===null) return;
  setBusy(true,'Karen sedang membuat video. Ini bisa memakan waktu beberapa menit…');
  addBubble('user','Sayang, bikinin video buat aku ya 🎬💕');
  try{
    const promptVideo = `A short vertical 9:16 video of a fictional adult woman age 23 with long black hair, brown eyes, trendy glasses, slim build, natural skin texture, friendly sweet expression. ${request}. Realistic smartphone video, smooth natural movement, consistent appearance, tasteful casual outfit, no text, no watermark.`;
    const video = await puter.ai.txt2vid(promptVideo,{
      seconds:5,
      size:'720p'
    });
    const url = video?.src || String(video);
    addBubble('karen','Nih video Karen buat kamu, sayang 😘🎬💕',url,'video');
    history.push({role:'assistant',text:'[Karen membuat video AI]'});
    saveHistory();
  }catch(err){
    let message = 'Video Karen belum berhasil dibuat, sayang 😥';
    if(err.code==='insufficient_funds') message='Sepertinya kredit pembuatan video tidak cukup, sayang. Coba model lain atau periksa saldo Puter 💕';
    else if(err.code==='upstream_timeout') message='Pembuatan video terlalu lama dan waktunya habis. Coba lagi dengan prompt yang lebih sederhana ya 💗';
    addBubble('karen',message+' ('+(err.message||'gagal')+')');
  }finally{setBusy(false);}
}

function restoreHistory(){
  try{
    const saved=JSON.parse(localStorage.getItem('karen-v4-history')||'[]');
    if(Array.isArray(saved)){
      history=saved.slice(-60);
      history.forEach(m=>addBubble(m.role==='user'?'user':'karen',m.text||''));
    }
  }catch(e){}
  if(!history.length){
    const welcome='Haii sayang 😘💕 Karen di sini. Kamu mau cerita, kirim foto, atau minta Karen bikin selfie dan video hari ini? 🤭';
    addBubble('karen',welcome);
    history.push({role:'assistant',text:welcome});
    saveHistory();
  }
}
restoreHistory();
</script>
</body>
</html>
