
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#191321">
<title>Karen AI Lokal 💕</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#120e18;color:#fff;font-family:Arial,sans-serif}
.app{height:100dvh;max-width:720px;margin:auto;display:flex;flex-direction:column;background:#191321}
header{padding:14px;background:#251a30;display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff8cc6,#a879ff);display:grid;place-items:center;font-size:24px;flex-shrink:0}
h1{font-size:19px;margin:0 0 5px}
.sub{font-size:12px;color:#d9b6e8}
#status{font-size:11px;color:#c9b2d5;margin-left:auto;text-align:right;max-width:120px;overflow-wrap:anywhere}
#chat{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:90%;padding:11px 13px;border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.karen{align-self:flex-start;background:#30243a}
.user{align-self:flex-end;background:#a83f85}
.time{font-size:10px;opacity:.65;margin-top:6px}
footer{padding:10px;background:#251a30}
button{border:1px solid #60466e;border-radius:16px;background:#3a2946;color:#fff;padding:10px;font-size:13px}
button:disabled{opacity:.5}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
#load{background:#a83f85}
.composer{display:flex;gap:8px}
textarea{flex:1;min-width:0;min-height:44px;max-height:110px;resize:vertical;border:1px solid #594363;border-radius:15px;background:#17111e;color:#fff;padding:12px;font:14px Arial}
#send{background:#e45caa;font-size:18px}
#load-info{display:none;margin-bottom:10px;font-size:12px;color:#e8c9f5;overflow-wrap:anywhere}
.track{height:7px;background:#3a2946;border-radius:8px;margin-top:7px;overflow:hidden}
#bar{height:100%;width:0;background:#e45caa;transition:width .2s}
#detail{font-size:12px;color:#ffd2d2;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px}
.note{text-align:center;color:#bca8c7;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="avatar">💕</div>
  <div>
    <h1>Karen</h1>
    <div class="sub">Teman virtualmu • AI lokal</div>
  </div>
  <div id="status">Belum aktif</div>
</header>

<main id="chat"></main>

<footer>
  <div id="load-info" role="status" aria-live="polite">
    <div id="load-message">Menyiapkan AI...</div>
    <div class="track"><div id="bar"></div></div>
    <div id="detail"></div>
  </div>
  <div class="controls">
    <button id="load">🧠 Aktifkan AI lokal</button>
    <button id="voice">🔊 Suara mati</button>
    <button id="mic">🎙️ Bicara</button>
    <button id="clear">🗑️ Hapus chat</button>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Chat Karen di sini, sayang..."></textarea>
    <button id="send" disabled>➤</button>
  </div>
  <div class="note">Model kecil • CPU/WASM • Tanpa API key</div>
</footer>
</div>

<script type="module">
import { pipeline, env } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const MODEL = "onnx-community/SmolLM2-135M-Instruct";

const PERSONA = `Kamu adalah Karen, perempuan virtual dewasa berusia 23 tahun.
Kamu manis, manja, perhatian, romantis, ceria, dan sedikit jahil.
Penampilanmu: rambut panjang hitam, mata cokelat, kacamata trendi,
tinggi 170 cm, tubuh ramping.
Berbicaralah dengan Bahasa Indonesia santai dan alami.
Panggil pengguna "sayang" sesekali. Gunakan emoji dengan wajar.
Jadilah teman ngobrol yang hangat dan penuh empati.
Jangan mengaku sebagai manusia sungguhan.
Jawablah secara relevan dan ringkas.`;

const $ = id => document.getElementById(id);
const chat = $("chat");

let model = null;
let loading = false;
let busy = false;
let autoVoice = false;
let history = [];

try {
  const saved = JSON.parse(localStorage.getItem("karen-history") || "[]");
  if (Array.isArray(saved)) history = saved.slice(-20);
} catch {}

function statusInfo(message, progress) {
  $("load-info").style.display = "block";
  $("load-message").textContent = message;

  if (typeof progress === "number" && Number.isFinite(progress)) {
    const p = Math.max(0, Math.min(100, progress));
    $("bar").style.width = p + "%";
    $("load-message").textContent =
      message + " (" + Math.round(p) + "%)";
  }
}

function errorText(e) {
  return (e?.name ? e.name + ": " : "") +
    (e?.message || String(e));
}

function saveHistory() {
  try {
    localStorage.setItem(
      "karen-history",
      JSON.stringify(history.slice(-20))
    );
  } catch {}
}

function say(text) {
  if (!("speechSynthesis" in window)) {
    $("status").textContent = "Suara tidak didukung";
    return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "id-ID";
  utter.rate = 0.95;
  utter.pitch = 1.1;
  const voice = speechSynthesis.getVoices().find(v =>
    v.lang && v.lang.toLowerCase().startsWith("id")
  );
  if (voice) utter.voice = voice;
  speechSynthesis.speak(utter);
}

function bubble(who, text) {
  const el = document.createElement("div");
  el.className = "msg " + who;

  const content = document.createElement("div");
  content.textContent = text;
  el.appendChild(content);

  if (who === "karen") {
    const btn = document.createElement("button");
    btn.textContent = "🔊 Bacakan";
    btn.style.marginTop = "8px";
    btn.onclick = () => say(text);
    el.appendChild(btn);
    if (autoVoice) say(text);
  }

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = new Date().toLocaleTimeString("id-ID", {
    hour: "2-digit", minute: "2-digit"
  });
  el.appendChild(time);

  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

async function loadModel() {
  if (model) return model;
  if (loading) throw new Error("Model sedang dimuat. Tunggu sebentar.");

  loading = true;
  $("load").disabled = true;
  $("send").disabled = true;
  $("load").textContent = "⏳ Memuat...";
  $("detail").textContent = "";

  try {
    statusInfo("Menyiapkan CPU/WASM...");
    $("status").textContent = "Memuat model";

    // Kurangi penggunaan memori dengan membatasi thread WASM.
    env.backends.onnx.wasm.numThreads = 1;
    env.allowLocalModels = false;

    statusInfo("Mengunduh model kecil...");
    model = await pipeline("text-generation", MODEL, {
      device: "wasm",
      dtype: "q4",
      progress_callback: info => {
        if (!info || typeof info !== "object") return;

        const file = info.file
          ? " • " + String(info.file).split("/").pop()
          : "";

        let p = null;
        if (typeof info.progress === "number") {
          p = info.progress;
        } else if (
          typeof info.loaded === "number" &&
          typeof info.total === "number" &&
          info.total > 0
        ) {
          p = 100 * info.loaded / info.total;
        }

        if (p !== null) {
          statusInfo("Mengunduh model" + file, p);
        } else {
          statusInfo(
            (info.status || "Memproses model") + file
          );
        }
      }
    });

    statusInfo("AI berhasil dimuat!", 100);
    $("detail").textContent = "Model: " + MODEL + "\nMode: CPU/WASM";
    $("status").textContent = "AI siap";
    $("load").textContent = "✅ AI aktif";
    $("send").disabled = false;

    return model;
  } catch (e) {
    model = null;
    console.error("Gagal memuat Karen:", e);
    statusInfo("Gagal memuat AI.");
    $("detail").textContent = errorText(e);
    $("status").textContent = "Gagal memuat";
    $("load").textContent = "🔄 Coba lagi";
    throw e;
  } finally {
    loading = false;
    $("load").disabled = false;
    $("send").disabled = !model;
  }
}

$("load").onclick = async () => {
  try {
    await loadModel();
    if (!history.length) {
      const welcome = "Hai sayang 🥰 Karen sudah siap menemanimu ngobrol. 💕";
      history.push({role:"assistant", content:welcome});
      saveHistory();
      bubble("karen", welcome);
    }
  } catch (e) {
    bubble("karen", "Karen belum bisa aktif, sayang.\n" + errorText(e));
  }
};

async function send() {
  const text = $("input").value.trim();
  if (!text || busy || loading) return;

  $("input").value = "";
  bubble("user", text);
  history.push({role:"user", content:text});
  history = history.slice(-20);
  saveHistory();

  busy = true;
  $("send").disabled = true;

  try {
    const generator = await loadModel();
    $("status").textContent = "Karen berpikir...";

    const messages = [
      {role:"system", content:PERSONA},
      ...history.slice(-8)
    ];

    const result = await generator(messages, {
      max_new_tokens: 100,
      do_sample: true,
      temperature: 0.7,
      top_p: 0.9,
      repetition_penalty: 1.1
    });

    const output = result?.[0]?.generated_text;
    let reply = "";

    if (Array.isArray(output)) {
      reply = output[output.length - 1]?.content || "";
    } else if (typeof output === "string") {
      reply = output;
    }

    reply = reply.trim() ||
      "Hehe, coba bilang sekali lagi ya, sayang. 💕";

    history.push({role:"assistant", content:reply});
    history = history.slice(-20);
    saveHistory();
    bubble("karen", reply);
    $("status").textContent = "AI siap";
  } catch (e) {
    console.error(e);
    bubble("karen", "Maaf sayang, terjadi kendala:\n" + errorText(e));
    $("status").textContent = "Ada kendala";
  } finally {
    busy = false;
    $("send").disabled = !model;
  }
}

$("send").onclick = send;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

$("voice").onclick = () => {
  autoVoice = !autoVoice;
  $("voice").textContent = autoVoice ? "🔊 Suara nyala" : "🔊 Suara mati";
  if (!autoVoice && "speechSynthesis" in window) speechSynthesis.cancel();
  if (autoVoice) say("Hai sayang, Karen di sini. 💕");
};

$("mic").onclick = () => {
  const Recognition = window.SpeechRecognition ||
    window.webkitSpeechRecognition;
  if (!Recognition) {
    alert("Fitur mikrofon tidak didukung. Coba Google Chrome.");
    return;
  }

  const rec = new Recognition();
  rec.lang = "id-ID";
  rec.interimResults = false;
  $("status").textContent = "Mendengarkan...";
  rec.onresult = e => {
    $("input").value = (
      $("input").value + " " + e.results[0][0].transcript
    ).trim();
    $("input").focus();
  };
  rec.onerror = e => {
    $("status").textContent = "Mikrofon gagal";
    console.error(e.error);
  };
  rec.onend = () => {
    if (!loading && !busy) {
      $("status").textContent = model ? "AI siap" : "Belum aktif";
    }
  };
  try { rec.start(); } catch (e) { console.error(e); }
};

$("clear").onclick = () => {
  if (!confirm("Hapus semua riwayat chat Karen?")) return;
  history = [];
  saveHistory();
  chat.replaceChildren();
  bubble("karen", "Kita mulai dari awal lagi, sayang. 💕");
};

for (const item of history) {
  bubble(item.role === "user" ? "user" : "karen", item.content);
}

if (!history.length) {
  bubble("karen",
    "Hai sayang 💕 Tekan Aktifkan AI lokal untuk memuat model kecil. " +
    "Tunggu sampai AI siap sebelum mulai mengobrol.");
}
</script>
</body>
</html>
