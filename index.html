
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#191321">
<title>Karen AI Lokal 💕</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#120e18;color:#fff;font-family:Arial,sans-serif}
.app{height:100dvh;max-width:720px;margin:auto;display:flex;flex-direction:column;background:#191321}
header{padding:14px;background:#251a30;display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff8cc6,#a879ff);display:grid;place-items:center;font-size:24px;flex-shrink:0}
h1{font-size:19px;margin:0 0 5px}
.sub{font-size:12px;color:#d9b6e8}
#status{font-size:11px;color:#c9b2d5;margin-left:auto;text-align:right;max-width:120px}
#chat{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:90%;padding:11px 13px;border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.karen{align-self:flex-start;background:#30243a}
.user{align-self:flex-end;background:#a83f85}
.time{font-size:10px;opacity:.65;margin-top:6px}
footer{padding:10px;background:#251a30}
button{border:1px solid #60466e;border-radius:16px;background:#3a2946;color:#fff;padding:10px;font-size:13px}
button:disabled{opacity:.5}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
#load{background:#a83f85}
.composer{display:flex;gap:8px}
textarea{flex:1;min-width:0;min-height:44px;max-height:110px;resize:vertical;border:1px solid #594363;border-radius:15px;background:#17111e;color:#fff;padding:12px;font:14px Arial}
#send{background:#e45caa;font-size:18px}
#load-info{display:none;margin-bottom:10px;font-size:12px;color:#e8c9f5;overflow-wrap:anywhere}
.track{height:7px;background:#3a2946;border-radius:8px;margin-top:7px;overflow:hidden}
#bar{height:100%;width:0;background:#e45caa;transition:width .2s}
#detail{font-size:12px;color:#ffd2d2;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px}
.note{text-align:center;color:#bca8c7;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="avatar">💕</div>
  <div><h1>Karen</h1><div class="sub">Teman virtualmu • AI lokal</div></div>
  <div id="status">Belum aktif</div>
</header>
<main id="chat"></main>
<footer>
  <div id="load-info" role="status" aria-live="polite">
    <div id="load-message">Menyiapkan AI...</div>
    <div class="track"><div id="bar"></div></div>
    <div id="detail"></div>
  </div>
  <div class="controls">
    <button id="load">🧠 Aktifkan AI lokal</button>
    <button id="voice">🔊 Suara mati</button>
    <button id="mic">🎙️ Bicara</button>
    <button id="clear">🗑️ Hapus chat</button>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Chat Karen di sini, sayang..."></textarea>
    <button id="send" disabled>➤</button>
  </div>
  <div class="note">AI lokal • CPU/WASM • Tanpa API key</div>
</footer>
</div>

<script type="module">
import { pipeline, env } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const MODEL = "onnx-community/SmolLM2-135M-Instruct-ONNX";

const PERSONA = `Kamu adalah Karen, perempuan virtual dewasa berusia 23 tahun.
Kamu manis, manja, perhatian, romantis, ceria, dan sedikit jahil.
Penampilan: rambut panjang hitam, mata cokelat, kacamata trendi,
tinggi 170 cm, tubuh ramping dan kaki panjang.
Berbicaralah dalam Bahasa Indonesia santai dan alami.
Panggil pengguna sayang sesekali. Gunakan emoji secara wajar.
Jadilah teman ngobrol yang hangat, perhatian dan penuh empati.
Jangan mengaku sebagai manusia sungguhan. Jawablah sesuai konteks.`;

const $ = id => document.getElementById(id);
let model = null, loading = false, busy = false, autoVoice = false;
let history = [];

try {
  const s = JSON.parse(localStorage.getItem("karen-history") || "[]");
  if (Array.isArray(s)) history = s.slice(-20);
} catch {}

function progress(message, percent = null) {
  $("load-info").style.display = "block";
  $("load-message").textContent = message;
  if (typeof percent === "number" && Number.isFinite(percent)) {
    percent = Math.max(0, Math.min(100, percent));
    $("bar").style.width = percent + "%";
    $("load-message").textContent =
      message + " (" + Math.round(percent) + "%)";
  }
}

function save() {
  try {
    localStorage.setItem("karen-history", JSON.stringify(history.slice(-20)));
  } catch {}
}

function bubble(who, text) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  const body = document.createElement("div");
  body.textContent = text;
  el.appendChild(body);

  if (who === "karen") {
    const b = document.createElement("button");
    b.textContent = "🔊 Bacakan";
    b.style.marginTop = "8px";
    b.onclick = () => speak(text);
    el.appendChild(b);
    if (autoVoice) speak(text);
  }

  const t = document.createElement("div");
  t.className = "time";
  t.textContent = new Date().toLocaleTimeString("id-ID", {
    hour: "2-digit", minute: "2-digit"
  });
  el.appendChild(t);
  $("chat").appendChild(el);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    $("status").textContent = "Suara tidak tersedia";
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "id-ID";
  u.rate = 0.95;
  u.pitch = 1.1;
  const v = speechSynthesis.getVoices().find(x =>
    x.lang && x.lang.toLowerCase().startsWith("id")
  );
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function errorMessage(e) {
  return (e?.name ? e.name + ": " : "") +
    (e?.message || String(e));
}

async function loadModel() {
  if (model) return model;
  if (loading) throw new Error("Model masih dalam proses pemuatan.");

  loading = true;
  $("load").disabled = true;
  $("send").disabled = true;
  $("load").textContent = "⏳ Memuat...";
  $("detail").textContent = "";

  try {
    progress("Menyiapkan CPU/WASM...");
    $("status").textContent = "Memuat model";

    env.backends.onnx.wasm.numThreads = 1;
    env.allowLocalModels = false;

    progress("Memeriksa akses model di Hugging Face...");
    const onProgress = info => {
      if (!info || typeof info !== "object") return;
      const file = info.file
        ? " • " + String(info.file).split("/").pop()
        : "";

      let p = null;
      if (typeof info.progress === "number") p = info.progress;
      else if (typeof info.loaded === "number" &&
               typeof info.total === "number" && info.total > 0) {
        p = 100 * info.loaded / info.total;
      }

      if (p !== null) progress("Mengunduh model" + file, p);
      else progress((info.status || "Menyiapkan model") + file);
    };

    model = await pipeline("text-generation", MODEL, {
      device: "wasm",
      dtype: "q4",
      progress_callback: onProgress
    });

    progress("AI siap!", 100);
    $("detail").textContent = "Model: " + MODEL + "\nMode: CPU/WASM";
    $("status").textContent = "AI siap";
    $("load").textContent = "✅ AI aktif";
    return model;
  } catch (e) {
    model = null;
    console.error("Karen model error:", e);
    progress("Model gagal dimuat.");
    $("detail").textContent =
      errorMessage(e) +
      "\n\nPeriksa nama model, akses file model, dan koneksi internet.";
    $("status").textContent = "Gagal memuat";
    $("load").textContent = "🔄 Coba lagi";
    throw e;
  } finally {
    loading = false;
    $("load").disabled = false;
    $("send").disabled = !model;
  }
}

$("load").onclick = async () => {
  try {
    await loadModel();
    if (!history.length) {
      const msg = "Hai sayang 🥰 Karen sudah siap menemanimu ngobrol. 💕";
      history.push({role:"assistant", content:msg});
      save();
      bubble("karen", msg);
    }
  } catch (e) {
    bubble("karen", "Karen belum berhasil aktif, sayang.\n" + errorMessage(e));
  }
};

async function send() {
  const text = $("input").value.trim();
  if (!text || busy || loading) return;
  $("input").value = "";
  bubble("user", text);
  history.push({role:"user", content:text});
  history = history.slice(-20);
  save();

  busy = true;
  $("send").disabled = true;
  try {
    const generator = await loadModel();
    $("status").textContent = "Karen berpikir...";

    const messages = [
      {role:"system", content:PERSONA},
      ...history.slice(-8)
    ];

    const result = await generator(messages, {
      max_new_tokens: 100,
      do_sample: true,
      temperature: 0.7,
      top_p: 0.9,
      repetition_penalty: 1.1
    });

    const out = result?.[0]?.generated_text;
    let reply = "";
    if (Array.isArray(out)) reply = out[out.length - 1]?.content || "";
    else if (typeof out === "string") reply = out;
    reply = reply.trim() || "Hehe, coba bilang sekali lagi ya, sayang 💕";

    history.push({role:"assistant", content:reply});
    history = history.slice(-20);
    save();
    bubble("karen", reply);
    $("status").textContent = "AI siap";
  } catch (e) {
    console.error(e);
    bubble("karen", "Terjadi kendala:\n" + errorMessage(e));
    $("status").textContent = "Ada kendala";
  } finally {
    busy = false;
    $("send").disabled = !model;
  }
}

$("send").onclick = send;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

$("voice").onclick = () => {
  autoVoice = !autoVoice;
  $("voice").textContent = autoVoice ? "🔊 Suara nyala" : "🔊 Suara mati";
  if (!autoVoice && "speechSynthesis" in window) speechSynthesis.cancel();
  if (autoVoice) speak("Hai sayang, Karen di sini. 💕");
};

$("mic").onclick = () => {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) {
    alert("Mikrofon tidak didukung. Coba Google Chrome.");
    return;
  }
  const rec = new R();
  rec.lang = "id-ID";
  rec.interimResults = false;
  $("status").textContent = "Mendengarkan...";
  rec.onresult = e => {
    $("input").value = ($("input").value + " " +
      e.results[0][0].transcript).trim();
  };
  rec.onerror = e => {
    $("status").textContent = "Mikrofon gagal";
    console.error(e.error);
  };
  rec.onend = () => {
    if (!loading && !busy) $("status").textContent = model ? "AI siap" : "Belum aktif";
  };
  try { rec.start(); } catch (e) { console.error(e); }
};

$("clear").onclick = () => {
  if (!confirm("Hapus seluruh riwayat chat Karen?")) return;
  history = [];
  save();
  $("chat").replaceChildren();
  bubble("karen", "Kita mulai lagi dari awal, sayang 💕");
};

for (const m of history) {
  bubble(m.role === "user" ? "user" : "karen", m.content);
}
if (!history.length) {
  bubble("karen",
    "Hai sayang 💕 Tekan Aktifkan AI lokal untuk memuat model.");
}
</script>
</body>
</html>
