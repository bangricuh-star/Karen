
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7e8ef">
<title>Karen AI 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7fa;color:#392633;font-family:system-ui,Arial,sans-serif}
header{padding:16px;text-align:center;background:#f4dce8;border-bottom:1px solid #e7c5d6}
h1{margin:0;font-size:25px}
header p{margin:5px 0 0;font-size:13px}
#status{margin:12px;padding:12px;background:white;border:1px solid #edd5e0;border-radius:12px;overflow-wrap:anywhere;font-size:13px;white-space:pre-wrap}
.track{height:8px;margin-top:9px;background:#f2e5eb;border-radius:10px;overflow:hidden}
#bar{height:100%;width:0;background:#c65b91;transition:width .2s}
#percent{margin-top:5px;color:#725568;font-size:12px}
#chat{height:calc(100dvh - 285px);min-height:220px;overflow-y:auto;padding:12px}
.msg{max-width:88%;margin:8px 0;padding:11px 13px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{margin-left:auto;background:#f2d6e5;border-bottom-right-radius:4px}
.karen{margin-right:auto;background:white;border:1px solid #f0dce5;border-bottom-left-radius:4px}
.composer{position:sticky;bottom:0;padding:10px 12px;background:#fff7fa;border-top:1px solid #edd5e0}
textarea{width:100%;min-height:48px;max-height:120px;resize:vertical;border:1px solid #dcb9cb;border-radius:13px;padding:12px;font:inherit}
.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:600}
button:disabled{opacity:.5}
.primary{background:#c65b91;color:white}
.secondary{background:#f0dce6;color:#533449}
.note{margin-top:8px;font-size:12px;color:#725568}
</style>
</head>
<body>
<header>
<h1>💗 Karen</h1>
<p>Teman virtualmu yang manis, manja, dan perhatian</p>
</header>

<section id="status" aria-live="polite">
<div id="statusText">Karen belum diaktifkan.</div>
<div class="track"><div id="bar"></div></div>
<div id="percent">Model AI belum dimuat.</div>
</section>

<main id="chat" aria-live="polite">
<div class="msg karen">Hai, sayang 💗 Aku Karen. Tekan Aktifkan Karen dulu, ya.</div>
</main>

<section class="composer">
<textarea id="input" maxlength="1000" placeholder="Tulis pesan untuk Karen..."></textarea>
<div class="buttons">
<button id="activate" class="primary">Aktifkan Karen</button>
<button id="send" class="primary" disabled>Kirim 💗</button>
<button id="voice" class="secondary">🔊 Suara mati</button>
<button id="clear" class="secondary">Hapus chat</button>
</div>
<div class="note">AI berjalan di browser. Internet diperlukan untuk mengunduh model pertama kali. Tidak memakai API key atau kredit.</div>
</section>

<script type="module">
const MODEL = "onnx-community/SmolLM2-135M-Instruct-ONNX";
const LIBRARY = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const $ = id => document.getElementById(id);
const statusText = $("statusText");
const bar = $("bar");
const percent = $("percent");
const chat = $("chat");
const input = $("input");
const activate = $("activate");
const send = $("send");
const voice = $("voice");

let ai = null;
let loading = false;
let busy = false;
let voiceOn = false;
let history = [];

const KEY = "karen-chat-v4";

function status(message, value) {
  statusText.textContent = message;
  if (typeof value === "number" && Number.isFinite(value)) {
    const n = Math.max(0, Math.min(100, value));
    bar.style.width = n + "%";
    percent.textContent = Math.round(n) + "%";
  }
}

function bubble(role, text, save = true) {
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "user" : "karen");
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;

  if (save) {
    history.push({
      role: role === "user" ? "user" : "assistant",
      content: text
    });
    history = history.slice(-12);
    try {
      localStorage.setItem(KEY, JSON.stringify(history));
    } catch (_) {}
  }
  return el;
}

function showError(error) {
  const detail = String(error?.message || error || "Error tidak diketahui");
  console.error("Karen AI error:", error);

  if (/401|403|unauthorized|forbidden/i.test(detail)) {
    return "Akses berkas model ditolak. Periksa koneksi atau akses Hugging Face.\n\nDetail error:\n" + detail;
  }
  if (/memory|allocation|wasm|out of memory/i.test(detail)) {
    return "Memori HP tidak cukup untuk menjalankan model. Tutup tab dan aplikasi lain lalu muat ulang halaman.\n\nDetail error:\n" + detail;
  }
  if (/fetch|network|load failed|failed to load/i.test(detail)) {
    return "Unduhan gagal. Periksa koneksi internet dan coba lagi.\n\nDetail error:\n" + detail;
  }
  return "Karen belum bisa aktif.\n\nDetail error:\n" + detail;
}

async function startAI() {
  if (loading || ai) return;
  loading = true;
  activate.disabled = true;

  try {
    status("Menyiapkan pustaka AI...", 0);

    const { pipeline, env } = await import(LIBRARY);

    env.allowRemoteModels = true;
    env.allowLocalModels = false;
    env.useBrowserCache = true;
    env.backends.onnx.wasm.numThreads = 1;

    status("Mengunduh model: " + MODEL, 1);
    percent.textContent = "Unduhan bisa memerlukan waktu. Jangan tutup halaman.";

    ai = await pipeline("text-generation", MODEL, {
      device: "wasm",
      dtype: "q4",
      progress_callback: info => {
        if (!info) return;

        if (typeof info.progress === "number") {
          status(
            "Memuat berkas: " + (info.file || info.status || "model AI"),
            info.progress
          );
        } else if (info.status === "done") {
          status("Berkas selesai dimuat.", 100);
        } else if (info.status) {
          status("Menyiapkan model: " + info.status);
        }
      }
    });

    status("Karen sudah aktif 💗", 100);
    percent.textContent = "Model berhasil dimuat. Kamu bisa mulai ngobrol.";
    activate.textContent = "Karen aktif 💗";
    send.disabled = false;

    bubble("assistant", "Aku sudah di sini, sayang! 💗 Cerita dong, hari kamu gimana?");
  } catch (error) {
    ai = null;
    status(showError(error));
    percent.textContent = "Pemuatan gagal. Detail error ditampilkan di atas.";
    activate.disabled = false;
    activate.textContent = "Coba aktifkan lagi";
  } finally {
    loading = false;
  }
}

function getReply(result) {
  const value = result?.[0]?.generated_text;

  if (typeof value === "string") return value;

  if (Array.isArray(value)) {
    for (let i = value.length - 1; i >= 0; i--) {
      if (value[i]?.role === "assistant") return value[i].content || "";
    }
    const last = value[value.length - 1];
    if (last && typeof last.content === "string") return last.content;
  }

  return "";
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || busy) return;

  if (!ai) {
    bubble("assistant", "Aktifkan Karen dulu, sayang 💗");
    return;
  }

  busy = true;
  send.disabled = true;
  input.disabled = true;
  bubble("user", text);
  input.value = "";

  const waiting = bubble("assistant", "Sebentar ya, sayang... 💗", false);

  try {
    const messages = [
      {
        role: "system",
        content: "Namamu Karen, perempuan virtual berusia 23 tahun. Kamu manis, manja, perhatian, hangat, dan sedikit playful. Kamu adalah crush virtual pengguna. Selalu berbicara dalam Bahasa Indonesia santai dan alami. Jawab ringkas seperti teman dekat, jangan mengaku sebagai manusia sungguhan."
      },
      ...history.slice(-8).map(item => ({
        role: item.role,
        content: item.content
      }))
    ];

    const result = await ai(messages, {
      max_new_tokens: 80,
      do_sample: true,
      temperature: 0.7,
      top_p: 0.9,
      repetition_penalty: 1.1
    });

    let reply = getReply(result).trim();
    if (!reply) reply = "Maaf, sayang, aku belum menemukan jawabannya. Coba tanya lagi, ya. 💗";

    waiting.textContent = reply;
    history.push({ role: "assistant", content: reply });
    history = history.slice(-12);

    try {
      localStorage.setItem(KEY, JSON.stringify(history));
    } catch (_) {}

    chat.scrollTop = chat.scrollHeight;

    if (voiceOn && "speechSynthesis" in window) {
      speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(reply);
      speech.lang = "id-ID";
      speechSynthesis.speak(speech);
    }
  } catch (error) {
    waiting.textContent = showError(error);
  } finally {
    busy = false;
    input.disabled = false;
    send.disabled = !ai;
    input.focus();
  }
}

function restoreChat() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (!Array.isArray(saved) || !saved.length) return;

    history = saved.filter(item =>
      item &&
      ["user", "assistant"].includes(item.role) &&
      typeof item.content === "string"
    ).slice(-12);

    chat.replaceChildren();
    for (const item of history) {
      bubble(item.role, item.content, false);
    }
  } catch (error) {
    console.warn("Riwayat chat tidak dapat dibaca:", error);
  }
}

activate.addEventListener("click", startAI);
send.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

voice.addEventListener("click", () => {
  voiceOn = !voiceOn;
  voice.textContent = voiceOn ? "🔊 Suara aktif" : "🔊 Suara mati";
  if (!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
});

$("clear").addEventListener("click", () => {
  if (!confirm("Hapus semua riwayat chat Karen?")) return;
  history = [];
  try { localStorage.removeItem(KEY); } catch (_) {}
  chat.replaceChildren();
  bubble("assistant", "Hai lagi, sayang 💗 Aku Karen. Mau cerita apa?");
});

restoreChat();
</script>
</body>
</html>
